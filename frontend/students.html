<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students · Smart School Attendance</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>

  <main class="main-content">
    <div class="page-header">
      <h1>Students</h1>
      <a href="register.html" class="btn btn-gold">+ Register New Student</a>
    </div>

    <div class="card">
      <div class="filters-bar">
        <input type="text" id="search-input" placeholder="Search by name or ID..." style="min-width:220px;" />
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Student ID</th><th>Name</th><th>Class</th><th>Section</th>
              <th>Roll No.</th><th>Face Registered</th><th>Registered On</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="students-body">
            <tr><td colspan="8"><div class="skeleton" style="height:14px;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
let allStudents = [];

function renderStudents(list) {
  const body = document.getElementById("students-body");
  if (list.length === 0) {
    body.innerHTML = `<tr><td colspan="8" class="empty-state" style="padding:30px;">No students found.</td></tr>`;
    return;
  }
  body.innerHTML = list
    .map(
      (s) => `
    <tr>
      <td><b>${s.student_id}</b></td>
      <td>${s.name}</td>
      <td>${s.class_name}</td>
      <td>${s.section}</td>
      <td>${s.roll_number}</td>
      <td>${s.face_registered ? '<span class="badge present">✓ Registered</span>' : '<span class="badge absent">Not Registered</span>'}</td>
      <td>${new Date(s.created_at).toLocaleDateString()}</td>
      <td style="display:flex; gap:6px;">
        <button class="btn btn-outline btn-sm view-btn" data-id="${s.student_id}">View</button>
        <button class="btn btn-danger btn-sm delete-btn" data-id="${s.student_id}">Delete</button>
      </td>
    </tr>`
    )
    .join("");

  document.querySelectorAll(".delete-btn").forEach((btn) =>
    btn.addEventListener("click", () => handleDelete(btn.dataset.id))
  );
  document.querySelectorAll(".view-btn").forEach((btn) =>
    btn.addEventListener("click", () => (window.location.href = `records.html?student_id=${btn.dataset.id}`))
  );
}

async function handleDelete(studentId) {
  const confirmed = await confirmModal({
    title: "Delete Student",
    message: `Are you sure you want to delete ${studentId}? This will also remove their attendance history. This cannot be undone.`,
    confirmLabel: "Delete",
  });
  if (!confirmed) return;

  try {
    await api.del(`/students/${studentId}`);
    showToast("Student deleted.", "success");
    loadStudents();
  } catch (err) {
    showToast(err.message, "error");
  }
}

async function loadStudents() {
  const body = document.getElementById("students-body");
  body.innerHTML = skeletonRows(8, 5);
  try {
    allStudents = await api.get("/students");
    renderStudents(allStudents);
  } catch (err) {
    showToast(err.message, "error");
  }
}

document.getElementById("search-input").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  renderStudents(
    allStudents.filter((s) => s.name.toLowerCase().includes(q) || s.student_id.toLowerCase().includes(q))
  );
});

loadStudents();
</script>
</body>
</html>
