<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance Records · Smart School Attendance</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-slot"></div>

  <main class="main-content">
    <div class="page-header">
      <h1>Attendance Records</h1>
    </div>

    <div class="card">
      <div class="filters-bar">
        <input type="date" id="f-date-from" placeholder="From" />
        <input type="date" id="f-date-to" placeholder="To" />
        <input type="text" id="f-student-id" placeholder="Student ID" />
        <input type="text" id="f-class" placeholder="Class" />
        <input type="text" id="f-section" placeholder="Section" />
        <select id="f-status">
          <option value="">Any Status</option>
          <option value="Present">Present</option>
          <option value="Absent">Absent</option>
        </select>
        <select id="f-method">
          <option value="">Any Method</option>
          <option value="AI Face Recognition">AI Face Recognition</option>
          <option value="Manual">Manual</option>
        </select>
        <button class="btn btn-primary" id="apply-filters-btn" type="button">Apply Filters</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>Date</th><th>Time</th><th>Student</th><th>Class</th><th>Status</th><th>Method</th><th>Confidence</th></tr>
          </thead>
          <tbody id="records-body">
            <tr><td colspan="7"><div class="skeleton" style="height:14px;"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
async function loadRecords() {
  const body = document.getElementById("records-body");
  body.innerHTML = skeletonRows(7, 6);

  const params = new URLSearchParams();
  const map = {
    "f-date-from": "date_from", "f-date-to": "date_to", "f-student-id": "student_id",
    "f-class": "class_name", "f-section": "section", "f-status": "status", "f-method": "method",
  };
  for (const [id, key] of Object.entries(map)) {
    const val = document.getElementById(id).value.trim();
    if (val) params.append(key, val);
  }

  try {
    const records = await api.get(`/attendance?${params.toString()}`);
    if (records.length === 0) {
      body.innerHTML = `<tr><td colspan="7" class="empty-state" style="padding:30px;">No records match these filters.</td></tr>`;
      return;
    }
    body.innerHTML = records
      .map(
        (r) => `
      <tr>
        <td>${r.date}</td>
        <td>${r.time}</td>
        <td><b>${r.student.name}</b><br/><span style="color:var(--slate-400); font-size:0.78rem;">${r.student.student_id}</span></td>
        <td>${r.student.class_name} - ${r.student.section}</td>
        <td><span class="badge ${r.status.toLowerCase()}">${r.status}</span></td>
        <td><span class="badge ${r.method.includes("AI") ? "ai" : "manual"}">${r.method}</span></td>
        <td>${r.confidence ? r.confidence + "%" : "—"}</td>
      </tr>`
      )
      .join("");
  } catch (err) {
    showToast(err.message, "error");
  }
}

document.getElementById("apply-filters-btn").addEventListener("click", loadRecords);

// Pre-fill filter from ?student_id= query param (e.g. linked from Students page)
const urlParams = new URLSearchParams(window.location.search);
const presetStudentId = urlParams.get("student_id");
if (presetStudentId) document.getElementById("f-student-id").value = presetStudentId;

loadRecords();
</script>
</body>
</html>
